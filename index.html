<style>
:root{
  --bg:#e9f5fb; --bg2:#d7ecf7; --card:#ffffff; --ink:#1d2b44; --muted:#5a6b82; --line:#d3e2ee;
  --accent:#ff8a3d; --accent2:#ff6b2c; --accentInk:#ffffff; --ok:#1f9d74; --okbg:#e3f6ee; --bad:#d64045; --badbg:#fdecec;
  --hint:#8a5a00; --hintbg:#fff4d6; --sea:#3e8fc4; --paper:#fffaf0; --paperline:#e8dcc0; --chip:#f2f7fb; --chipline:#c6d8e6;
  --sel:#ffe2cc; --selline:#ff8a3d; --shadow:0 6px 22px rgba(29,43,68,.10); --radius:20px;
  --tN:#3a86ff; --tV:#e63946; --tA:#2a9d8f; --tArt:#8a6cf0; --tP:#f4a259;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a2b; --bg2:#14233a; --card:#18263b; --ink:#e9f1f8; --muted:#a3b6cc; --line:#2b3d57;
    --okbg:#12352c; --badbg:#3a1c22; --hintbg:#3a2f12; --hint:#ffd27a; --paper:#20283a; --paperline:#33405a;
    --chip:#1f3049; --chipline:#3a5072; --sel:#4a2d18; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a2b; --bg2:#14233a; --card:#18263b; --ink:#e9f1f8; --muted:#a3b6cc; --line:#2b3d57;
  --okbg:#12352c; --badbg:#3a1c22; --hintbg:#3a2f12; --hint:#ffd27a; --paper:#20283a; --paperline:#33405a;
  --chip:#1f3049; --chipline:#3a5072; --sel:#4a2d18; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Andika',system-ui,sans-serif;font-size:18px;line-height:1.5;
  background-image:radial-gradient(circle at 10% 0%,var(--bg2) 0,transparent 40%),radial-gradient(circle at 90% 100%,var(--bg2) 0,transparent 45%);min-height:100vh}
h1,h2,h3,.fred{font-family:'Fredoka','Andika',system-ui,sans-serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:28px} h2{font-size:24px} h3{font-size:20px}
button{font:inherit;color:inherit}
b,strong{font-weight:700}
i{font-style:italic}
s{opacity:.75}
.app{max-width:1000px;margin:0 auto;padding:14px 16px 60px}
.hidden{display:none!important}
.small{font-size:15px;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.top .logo{width:54px;height:66px;flex:none}
.top .logo svg{width:100%;height:100%}
.top h1{font-size:26px}
.top .sub{font-size:15px;color:var(--muted)}
.fishpill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font-family:'Fredoka';font-weight:600;font-size:19px;white-space:nowrap}
.fishpill svg{width:26px;height:16px}
.fishpill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
.card.flat{box-shadow:none}

/* map */
.mapcard{padding:10px;overflow:hidden}
.island{width:100%;height:auto;display:block;border-radius:14px;touch-action:manipulation}
.island .hit{fill:transparent}
.island .st{cursor:pointer}
.island .st:focus{outline:none}
.island .st:focus-visible .hit{stroke:#ff8a3d;stroke-width:4;fill:rgba(255,138,61,.08)}
.island .mlabel{font-family:'Fredoka';font-weight:600;font-size:23px;fill:#1d2b44;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.island .mlabel.small{font-size:19px}
.island .mz{font-family:'Fredoka';font-weight:600;font-size:15px;fill:#5a7fa6}
.island .mz.big{font-size:20px}
.island .msign{font-family:'Fredoka';font-weight:700;font-size:11px;fill:#7a5a3a;text-anchor:middle}
.island .wave{stroke:#d8f0ff;stroke-width:3;fill:none;stroke-linecap:round;opacity:.7}
.island .rt{fill:none;stroke:#ffffff;stroke-width:5;stroke-dasharray:1 13;stroke-linecap:round;opacity:.9}
.island .rt.on{stroke:#ff8a3d;stroke-width:6;opacity:1}
.island .badge circle{fill:#fff;stroke:#1d2b44;stroke-width:3}
.island .badge text{font-family:'Fredoka';font-weight:700;font-size:17px;text-anchor:middle;fill:#1d2b44}
.island .badge.open circle{fill:#ff8a3d;stroke:#fff}
.island .badge.open text{fill:#fff}
.island .badge.done circle{fill:#1f9d74;stroke:#fff}
.island .badge .ck{stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.island .st-closed > :not(.hit):not(.mlabel):not(.badge){opacity:.82}
.island .st.pulse .badge circle{animation:pulse 1.4s infinite}
@keyframes pulse{50%{stroke-width:7;stroke:#ffd166}}
.island .stone .hit{fill:transparent}
.island .stone.tappable{cursor:pointer}
.island .stone.tappable .hit{fill:rgba(255,209,102,.18);stroke:#ffd166;stroke-width:3;stroke-dasharray:6 6;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.island .xmark{animation:pop .6s}
@keyframes pop{0%{transform-box:fill-box;transform-origin:center;opacity:0}100%{opacity:1}}
.pelle-walker.walking .pw-wob{animation:waddle .28s infinite alternate;transform-box:fill-box;transform-origin:50% 95%}
@keyframes waddle{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

/* clue */
.clue{display:flex;gap:14px;align-items:flex-start}
.clue .av{width:70px;height:86px;flex:none}
.clue .av svg{width:100%;height:100%}
.bubble{position:relative;background:var(--paper);border:2px solid var(--paperline);border-radius:18px;padding:12px 16px;flex:1}
.bubble:before{content:"";position:absolute;left:-11px;top:24px;border:10px solid transparent;border-right-color:var(--paperline);border-left:0}
.bubble .lab{font-family:'Fredoka';font-weight:600;color:var(--accent2);font-size:17px}
.quote{background:rgba(127,160,190,.12);border-left:4px solid #8ecae6;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:19px}

/* treasure map */
.tmap{width:100%;height:auto;display:block}
.tmap .sktxt{font-family:'Fredoka';font-weight:600;font-size:22px;fill:#5b3a1e;text-anchor:middle}
.tmap .skn{font-family:'Fredoka';font-weight:600;font-size:15px;fill:#8a5a2b}
.tmap .skq{font-family:'Fredoka';font-weight:700;font-size:54px;fill:#9fb3c8;text-anchor:middle}
.tmap .skhint{font-family:'Fredoka';font-weight:500;font-size:15px;fill:#7d90a6;text-anchor:middle}
.tmap .pmiss{fill:rgba(160,185,210,.14);stroke:#9fb3c8;stroke-width:2.5;stroke-dasharray:8 7}
.tmap .pedge{fill:none;stroke:#b08a55;stroke-width:2.5}
.tmap .piece.got{filter:drop-shadow(0 3px 3px rgba(60,40,10,.25))}
.tmap .phit{fill:transparent}
.tmap .piece.tappable{cursor:pointer}
.tmap .piece.sel .pedge{stroke:#ff6b2c;stroke-width:8}
.tmap .piece.new{animation:pieceIn .9s ease-out}
@keyframes pieceIn{0%{opacity:0;transform:translateY(-30px)}100%{opacity:1}}
.tmap .plate{fill:#f6ead0;stroke:#c9a46a;stroke-width:1.5;opacity:.93}
.tmap .skrole{font-family:'Fredoka';font-weight:600;font-size:14px;text-anchor:middle;fill:#fff}
.tmap .rplate{opacity:.95}
.tmap .r-Z{fill:#1f7a5a}.tmap .r-O{fill:#c0392b}.tmap .r-S{fill:#2a5cb8}.tmap .r-P{fill:#8a3fb8}.tmap .r-X{fill:#7a6a55}

/* menu */
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px;cursor:pointer;font-family:'Fredoka';font-weight:500;font-size:16px;text-align:center;min-height:86px;position:relative}
.mbtn svg{width:30px;height:30px}
.mbtn:active{transform:translateY(1px)}
.mbtn .cnt{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;border-radius:999px;font-size:13px;padding:0 7px;min-width:22px}
@media (max-width:640px){.menu{grid-template-columns:repeat(3,1fr)}}

/* buttons */
.btn{appearance:none;border:0;border-radius:14px;padding:12px 20px;min-height:52px;font-family:'Fredoka';font-weight:600;font-size:19px;cursor:pointer;background:var(--accent);color:var(--accentInk);box-shadow:0 3px 0 var(--accent2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #157a5a}
.btn.sm{min-height:42px;padding:8px 14px;font-size:16px}
.btn.wide{width:100%}
.btn svg{width:22px;height:22px}
.linkbtn{background:none;border:0;color:var(--accent2);font-family:'Fredoka';font-weight:600;cursor:pointer;padding:6px 4px;font-size:16px}

/* stage view */
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backbtn{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.backbtn svg{width:22px;height:22px}
.shead .t{flex:1;min-width:0}
.shead .t .k{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 14px}
.dot{width:26px;height:10px;border-radius:6px;background:var(--line)}
.dot.p{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px);border:2px solid var(--line);height:12px}
.dot.cur{outline:3px solid var(--accent);outline-offset:1px}
.dot.ok1{background:var(--ok)} .dot.ok2{background:#7cc9a8} .dot.fail{background:var(--bad)}
.dot.p.done{background:#f4a259;border-color:#f4a259}

.task .badgeline{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tbadge{font-family:'Fredoka';font-weight:600;font-size:14px;border-radius:999px;padding:3px 10px;background:var(--chip);border:1px solid var(--chipline)}
.tbadge.paper{background:#fff0d6;border-color:#f4c27a;color:#7a4a00}
.task .q{font-size:20px;margin-bottom:14px}
.task .q .quote{font-size:19px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.fb{border-radius:14px;padding:10px 14px;margin-top:14px;font-size:17px}
.fb.ok{background:var(--okbg);color:var(--ink);border:2px solid #8fd6bc}
.fb.bad{background:var(--badbg);border:2px solid #f2a4a7}
.fb.hint{background:var(--hintbg);border:2px solid #f1d27a}
.fb .h{font-family:'Fredoka';font-weight:600;font-size:18px}

/* mc */
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--chip);border:2px solid var(--chipline);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:18px;min-height:52px}
.opt.sel{background:var(--sel);border-color:var(--selline)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through;opacity:.8}
.opt[disabled]{cursor:default}

/* tap */
.taptext{font-size:22px;line-height:2.1}
.tok{display:inline-block;border-radius:10px;padding:0 5px;margin:0 1px;cursor:pointer;border:2px solid transparent;background:var(--chip)}
.tok.sel{background:var(--sel);border-color:var(--selline)}
.tok.good{background:var(--okbg);border-color:var(--ok)}
.tok.bad{background:var(--badbg);border-color:var(--bad)}
.tok.miss{border-color:var(--ok);border-style:dashed}
.punc{font-size:22px}
.orig{background:var(--paper);border:2px dashed var(--paperline);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:19px}
.orig .lab{font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--muted)}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:2px dashed var(--chipline);border-radius:14px;margin-bottom:12px}
.chip{background:var(--card);border:2px solid var(--chipline);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:18px;font-family:'Andika'}
.chip.sel{background:var(--sel);border-color:var(--selline);transform:translateY(-2px)}
.chip.good{border-color:var(--ok);background:var(--okbg)}
.chip.bad{border-color:var(--bad);background:var(--badbg)}
.chip.long{font-size:16px;text-align:left}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{border:2px solid var(--chipline);border-radius:14px;padding:8px;min-height:120px;background:var(--chip);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.bucket .bh{font-family:'Fredoka';font-weight:600;text-align:center;font-size:18px;padding:4px;border-radius:10px;background:var(--card)}
.bucket.target{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,61,.25)}
.bucket .chip{font-size:16px;padding:6px 8px}
@media (max-width:560px){.buckets.long{grid-template-columns:1fr}}

/* gaps */
.glines{display:grid;gap:12px}
.gline{font-size:20px;line-height:2.2}
.gap{display:inline-block;min-width:64px;min-height:40px;border:0;border-bottom:3px dashed var(--accent);background:var(--sel);border-radius:8px 8px 0 0;padding:0 8px;cursor:pointer;font-size:20px;font-family:'Andika';vertical-align:baseline;line-height:1.9}
.gap.filled{border-bottom-style:solid;background:var(--chip)}
.gap.good{background:var(--okbg);border-bottom-color:var(--ok)}
.gap.bad{background:var(--badbg);border-bottom-color:var(--bad)}
.gap.pg{min-width:38px;text-align:center;font-weight:700;font-size:24px;padding:0 4px;margin:0 1px}
.gap.pg.none{color:var(--muted);font-weight:400}

/* type */
.fields{display:grid;gap:12px}
.field label{display:block;font-size:18px;margin-bottom:4px}
.field .inp{display:flex;gap:8px;align-items:center}
.field input{width:100%;font:inherit;font-size:21px;padding:10px 12px;border-radius:12px;border:2px solid var(--chipline);background:var(--card);color:var(--ink);min-height:52px}
.field input:focus{outline:none;border-color:var(--accent)}
.field.good input{border-color:var(--ok);background:var(--okbg)}
.field.bad input{border-color:var(--bad);background:var(--badbg)}
.field .msg{font-size:16px;margin-top:4px;color:var(--hint)}
.field .mark{font-size:22px;width:28px;text-align:center}
.qkeys{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.qkeys button{min-width:44px;min-height:40px;border-radius:10px;border:2px solid var(--chipline);background:var(--chip);font-size:20px;cursor:pointer}

/* split */
.splitline{font-size:23px;line-height:2.4;display:flex;flex-wrap:wrap;align-items:center}
.splitline .w{padding:0 2px}
.divbtn{width:26px;height:46px;border:0;background:transparent;cursor:pointer;position:relative;margin:0 1px}
.divbtn:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--chipline);opacity:.6}
.divbtn.on:before{background:var(--accent);opacity:1;top:2px;bottom:2px;width:5px}
.divbtn.good:before{background:var(--ok)} .divbtn.bad:before{background:var(--bad)} .divbtn.miss:before{background:var(--ok);opacity:.5}

/* label */
.segs{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;font-size:21px}
.segs.block{flex-direction:column;align-items:stretch}
.seg{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--chipline);background:var(--chip);border-radius:12px;padding:6px 10px;cursor:pointer;min-width:60px;font-size:21px}
.segs.block .seg{flex-direction:row;justify-content:space-between;text-align:left;gap:10px;font-size:19px}
.seg .lb{font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--muted);border-top:2px dashed var(--chipline);padding-top:2px;min-width:70px;text-align:center}
.segs.block .seg .lb{border-top:0;border-left:2px dashed var(--chipline);padding:0 0 0 10px;min-width:96px;white-space:nowrap}
.seg.filled .lb{color:var(--accent2)}
.seg.good{border-color:var(--ok);background:var(--okbg)} .seg.bad{border-color:var(--bad);background:var(--badbg)}
.segtail{font-size:21px;align-self:center}

/* build */
.bline{min-height:60px;border:2px solid var(--chipline);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper);margin-bottom:10px;font-size:20px}
.bline.list{flex-direction:column;align-items:stretch}
.bline .ph{color:var(--muted);font-size:16px}
.bline.good{border-color:var(--ok)} .bline.bad{border-color:var(--bad)}
.preview{font-size:20px;margin:-2px 0 10px;color:var(--muted)}

/* paper */
.papertask{background:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0 33px,var(--paperline) 33px 34px);border:2px solid var(--paperline);border-radius:16px;padding:16px 18px 18px 50px;position:relative}
.papertask:before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:#f2a4a7;opacity:.7}
.papertask .pic{display:flex;justify-content:center;margin:8px 0}
.papertask .pic svg{width:min(320px,100%);height:auto}
.compass .cpl{font-family:'Fredoka';font-weight:700;font-size:15px;text-anchor:middle;fill:#1d2b44}
.compass .cpm{font-family:'Fredoka';font-weight:600;font-size:17px;text-anchor:middle;fill:#1d2b44}
.pstatus{font-family:'Fredoka';font-weight:600;border-radius:999px;padding:3px 10px;font-size:14px;display:inline-block}
.ps-none{background:var(--chip);color:var(--muted)}
.ps-written{background:#fff0d6;color:#7a4a00}
.ps-ok,.ps-okfix{background:var(--okbg);color:var(--ok)}
.ps-fix{background:var(--badbg);color:var(--bad)}
.ps-refix{background:#e8e2ff;color:#5a3fb8}

/* merke */
.merke .mk{border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--chip);border:1px solid var(--chipline)}
.merke .mk.warn{background:var(--badbg);border-color:#f2a4a7}
.merke .mk.tip{background:var(--okbg);border-color:#8fd6bc}
.tag{display:inline-block;color:#fff;border-radius:8px;padding:0 8px;margin-right:4px;font-family:'Fredoka';font-weight:600;font-size:16px}
.tN{background:var(--tN)}.tV{background:var(--tV)}.tA{background:var(--tA)}.tArt{background:var(--tArt)}.tP{background:var(--tP)}
.tS{background:#2a5cb8}.tPr{background:#8a3fb8}.tZ{background:#1f7a5a}.tO{background:#c0392b}
.tE{background:#2a9d8f}.tH{background:#3a86ff}.tSch{background:#e0a100}
.big{font-size:24px}

/* sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(15,26,43,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .h{font-family:'Fredoka';font-weight:600;margin-bottom:10px;color:var(--muted)}
.sheet .choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sheet .choices.p{grid-template-columns:repeat(4,1fr)}
.sheet .choices button{min-height:56px;border-radius:14px;border:2px solid var(--chipline);background:var(--chip);font-size:20px;cursor:pointer;padding:6px}
.sheet .choices.p button{font-size:28px;font-weight:700}
.modalwrap{position:fixed;inset:0;background:rgba(15,26,43,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--card);border-radius:24px;max-width:680px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:up .25s ease-out;max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{max-width:900px}
.modal .pel{width:110px;height:136px;margin:0 auto 6px;display:block}
.modal .pel svg{width:100%;height:100%}
.modal .center{text-align:center}
.modal h2{margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2b44;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-family:'Fredoka';font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}

/* lists, tables */
.list{display:grid;gap:10px}
.li{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.li .top2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.li .id{font-family:'Fredoka';font-weight:600;color:var(--muted);font-size:14px}
.sol{background:var(--okbg);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:17px}
.chk{margin:6px 0 0 0;padding-left:20px;font-size:16px}
.note{width:100%;min-height:60px;font:inherit;font-size:16px;border-radius:10px;border:2px solid var(--chipline);padding:8px;background:var(--card);color:var(--ink)}
table.rep{width:100%;border-collapse:collapse;font-size:16px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.rep th{font-family:'Fredoka';font-weight:600}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:22px;height:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-family:'Fredoka';font-weight:600;cursor:pointer;font-size:16px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lang-en{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px}
.lang-en h2,.lang-en h3{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ward{border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;background:var(--card);cursor:pointer}
.ward.on{border-color:var(--accent);background:var(--sel)}
.ward.locked{opacity:.5;cursor:not-allowed}
.ward svg{width:80px;height:100px}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin:12px 0}
.pinpad button{height:60px;border-radius:14px;border:2px solid var(--line);background:var(--chip);font-size:24px;cursor:pointer}
.pindots{display:flex;gap:10px;justify-content:center;font-size:30px;letter-spacing:6px}
.diploma{border:6px double #d99a00;border-radius:20px;padding:22px;text-align:center;background:linear-gradient(#fffdf3,#fff6d8);color:#1d2b44}
.diploma .gf svg{width:170px;height:auto}
.treasurepic{display:flex;justify-content:center;gap:10px;align-items:flex-end}

.review .li.okk{border-color:#8fd6bc} .review .li.no{border-color:#f2a4a7}

  body{font-size:17px}

  .bubble:before{display:none}
  .shead h2{font-size:20px} .shead .k{font-size:13px}

  .taptext,.splitline{font-size:20px}

}
.bubbles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0 4px}
.sb{position:relative;background:#fff;color:#1d2b44;border:2px solid #9fb3c8;border-radius:16px;padding:8px 12px 10px;font-size:18px}
.sb b{display:block;font-family:'Fredoka';font-weight:600;font-size:14px;color:#5a6b82}
.sb:after{content:"";position:absolute;left:22px;bottom:-12px;border:10px solid transparent;border-top-color:#9fb3c8;border-bottom:0}
.task .pic{display:flex;justify-content:center;margin:0 0 12px}
.task .pic svg{width:min(320px,100%);height:auto}
/* game */
.gamecard{background:linear-gradient(135deg,var(--card),var(--bg2))}
.gcrow{display:flex;align-items:center;gap:14px}
.gcpel{width:62px;height:78px;flex:none}.gcpel svg{width:100%;height:100%}
.gctxt{flex:1;min-width:0}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.gfishes{display:inline-flex;gap:6px}
.gf svg{width:30px;height:19px;filter:grayscale(1);opacity:.35}
.gf.on svg{filter:none;opacity:1}
.gfield{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:46px 14px 18px;border-radius:20px;margin-bottom:16px;
  background:linear-gradient(180deg,#bfe3f6 0%,#9fd2ee 100%);box-shadow:inset 0 0 0 3px #e8f6ff;overflow:hidden}
.gfield:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 60px,rgba(255,255,255,.25) 60px 62px);pointer-events:none}
.snow{position:relative;min-height:78px;border:0;border-radius:24px 24px 16px 16px;cursor:pointer;padding:8px 6px;line-height:1.2;
  background:radial-gradient(circle at 50% 25%,#ffffff 0,#f6fbff 55%,#dcecf6 100%);box-shadow:0 6px 0 #b6d5ea,0 8px 10px rgba(30,80,120,.15);
  font-family:'Andika',system-ui,sans-serif;font-size:17px;color:#1d2b44;word-break:break-word;transition:transform .15s}
.snow:active{transform:translateY(2px)}
.snow.dig{animation:gdig .38s}
.snow.no{animation:gshake .5s;box-shadow:0 6px 0 #e9a3a6,0 0 0 3px #d64045}

.snow.found .gfi svg{width:34px;height:21px;display:block;margin:0 auto 2px}
.snow.found .w{font-size:13px;opacity:.8}
.snow.melt{opacity:.45}
.gpelle{position:absolute;left:0;top:0;width:54px;height:68px;z-index:3;pointer-events:none;transition:transform .45s ease;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.gpelle svg{width:100%;height:100%}
.gchest{position:absolute;left:50%;top:50%;width:170px;transform:translate(-50%,-50%);z-index:4;animation:pop .6s}
.gchest svg{width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.big3 svg{width:40px;height:40px}
@keyframes gdig{30%{transform:scale(.9) translateY(5px)}60%{transform:scale(1.04)}}
@keyframes gshake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (max-width:560px){.gfield{gap:7px;padding:40px 8px 12px}.snow{min-height:66px;font-size:14px;border-radius:18px 18px 12px 12px;padding:6px 3px}.gcpel{width:48px;height:60px}.gpelle{width:38px;height:48px}.gmore{display:none}table.rep{display:block;overflow-x:auto;font-size:14px}table.rep th,table.rep td{padding:5px 4px}}
.menu{grid-template-columns:repeat(6,1fr)}
@media (max-width:640px){.menu{grid-template-columns:repeat(3,1fr)}}
#print{display:none}
@media print{
  body{background:#fff;font-size:12pt;color:#000}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print h1{font-size:18pt} #print h2{font-size:14pt;margin-top:14pt}
  #print .pi{break-inside:avoid;border-bottom:1px solid #999;padding:6pt 0}
  #print .sol{background:#eee}
}

function routeD(a, b, i) {
  const [x1, y1] = POS[a], [x2, y2] = POS[b];  // a, b = station keys
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1;
  const k = (i % 2 ? 0.18 : -0.18);
  return `M${x1} ${y1} Q${mx - dy * k} ${my + dx * k} ${x2} ${y2}`;
}

/* st: {order:[keys], names:[], found, done:[], pulse, stoneMode, stoneFound, chest, chestOpen, sunrise, wear, pelleXY} */
function islandMap(st) {
  const u = uid('m');
  const names = st.names, order = st.order, N = order.length - 1;
  let routes = '';
  for (let i = 1; i <= N; i++) {
    const walked = i <= st.found;
    routes += `<path d="${routeD(order[i - 1], order[i], i)}" class="${walked ? 'rt on' : 'rt'}"/>`;
  }
  let stations = '';
  for (let n = 0; n <= N; n++) {
    const key = order[n];
    const [x, y] = POS[key];
    const done = n > 0 && st.done[n];
    const found = n === 0 || n <= st.found;
    const state = n === 0 ? 'nest' : done ? 'done' : found ? 'open' : 'closed';
    const badge = n === 0 ? '' : `<g class="badge ${state}" transform="translate(-50 -48)"><circle r="16"/>${done ? '<path d="M-7 0 l5 5 l9 -10" class="ck"/>' : `<text y="6">${n}</text>`}</g>`;

      <text y="${key === 'schollen' ? 62 : key === 'walbucht' ? 52 : 58}" class="mlabel">${names[n]}</text></g>`;
  }
  let stones = '';
  for (const k of ['rund', 'flach', 'spitz']) {
    const [x, y] = STONES[k];
    stones += `<g class="stone${st.stoneMode ? ' tappable' : ''}" data-stone="${k}" transform="translate(${x} ${y})"><circle r="30" class="hit"/>${STONE_ART[k]}</g>`;
  }
  const [fx, fy] = STONES.flach;
  const xmark = st.stoneFound ? `<g transform="translate(${fx} ${fy - 2})" class="xmark"><path d="M-16 -16 L16 16 M16 -16 L-16 16" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>${st.chest ? `<g transform="translate(-34 -62) scale(.42)">${chest(!!st.chestOpen, u + 'ch', true)}</g>` : ''}</g>` : '';

  </svg>`;
}
function pelleSpot(key) { const [x, y] = POS[key]; return key === 'nest' ? [x + 62, y + 8] : key === 'walbucht' ? [x - 74, y + 24] : key === 'schollen' ? [x + 4, y + 10] : [x + 48, y + 22]; }

/* ───────────── Schatzkarte (10 Stücke, 2 × 5) ───────────── */
function jag(x, y, w, h, seed) {
  let r = seed * 9301 + 49297;
  const rnd = () => { r = (r * 9301 + 49297) % 233280; return r / 233280; };
  const pts = [];
  const n = 6, a = 5;
  for (let i = 0; i <= n; i++) pts.push([x + w * i / n, y + (rnd() - .5) * a * 2]);
  for (let i = 1; i <= n; i++) pts.push([x + w + (rnd() - .5) * a * 2, y + h * i / n]);
  for (let i = n - 1; i >= 0; i--) pts.push([x + w * i / n, y + h + (rnd() - .5) * a * 2]);
  for (let i = n - 1; i >= 1; i--) pts.push([x + (rnd() - .5) * a * 2, y + h * i / n]);
  return pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
}
/* o: {order:[keys], pieces:[{lines, role}] (index 1..N), got:{n:bool}, names:{n:str}, roles:bool, roleNames, sel:Set, tappable} */
function treasureMap(o) {

    <g transform="translate(${lt[0]} ${lt[1] - 16})"><path d="M-6 12 L6 12 L4 -12 L-4 -12 Z" fill="#a0522d"/><path d="M-6 -12 h12 l-6 -8z" fill="#c0392b"/></g>
    <g transform="translate(56 ${H * 2 - 48})" opacity=".8"><circle r="24" fill="none" stroke="#8a5a2b" stroke-width="2"/><path d="M0 -28 L6 0 L0 28 L-6 0 Z" fill="#8a5a2b"/><path d="M-28 0 L0 5 L28 0 L0 -5 Z" fill="#b08050"/><text y="-31" class="skn" text-anchor="middle">N</text></g>
  </g>`;
  let defs = `<defs>${content}`;
  let pieces = '';
  for (let i = 1; i <= N; i++) {
    const c = (i - 1) % cols, r = Math.floor((i - 1) / cols);
    const x = c * W, y = r * H;
    const poly = jag(x + 4, y + 4, W - 8, H - 8, i * 7);
    defs += `<clipPath id="${u}p${i}"><polygon points="${poly}"/></clipPath>`;
    const pc = o.pieces[i];
    const lines = pc.lines;
    const longest = Math.max.apply(null, lines.map(t => t.length));
    const fs = Math.min(22, Math.floor((W - 32) / (longest * 0.56)));
    if (o.got[i]) {
      const sel = o.sel && o.sel.has(i);
      const rn = o.roleNames[pc.role];
      const roleTxt = o.roles ? `<rect x="${x + 12}" y="${y + H - 42}" width="${W - 24}" height="28" rx="14" class="rplate r-${pc.role}"/><text x="${x + W / 2}" y="${y + H - 22.5}" class="skrole">${rn}</text>` : '';

        <g clip-path="url(#${u}p${i})"><use href="#${u}c"/></g>
        <polygon points="${poly}" class="pedge"/>
        <rect x="${x + 10}" y="${y + 16}" width="${W - 20}" height="${lines.length * 28 + 14}" rx="10" class="plate"/>
        ${lines.map((t, j) => `<text x="${x + W / 2}" y="${y + 39 + j * 28}" class="sktxt" style="font-size:${fs}px">${t}</text>`).join('')}
        ${roleTxt}<polygon points="${poly}" class="phit"/></g>`;
    } else {
      pieces += `<g class="piece miss" data-piece="${i}"><polygon points="${poly}" class="pmiss"/>
        <text x="${x + W / 2}" y="${y + H / 2 + 6}" class="skq">?</text>

    }
  }
  defs += '</defs>';
  return `<svg class="tmap" viewBox="-6 -6 ${TW + 12} ${H * 2 + 12}" role="img" aria-label="Schatzkarte">${defs}${pieces}</svg>`;
}

const norm = (s) => String(s).replace(/[„“”"‟«»]/g, '"').replace(/[‚‘’`´]/g, "'").replace(/\s+/g, ' ').replace(/\s+([.,!?:;])/g, '$1').replace(/([,:])(?=[^\s"])/g, '$1 ').replace(/"\s+([.,!?])/g, '"$1').trim();

function judgeField(f, val) {
  const v = norm(val);

  if (ok) return { ok: true, msg: '' };
  for (const [n, m] of (f.near || [])) if (norm(n) === v && m) return { ok: false, msg: m };
  for (const a of f.a) {
    const na = norm(a);
    if (na.toLowerCase() === v.toLowerCase()) return { ok: false, msg: 'Fast! Prüfe die Groß- und Kleinschreibung.' };
    if (deUml(na) === deUml(v) || deUml(na).toLowerCase() === deUml(v).toLowerCase()) return { ok: false, msg: 'Fast! Fehlt ein Umlaut (ä, ö, ü) oder ein ß?' };
    if (noPunct(na) === noPunct(v)) return { ok: false, msg: 'Fast! Prüfe die Satzzeichen.' };
  }
  return { ok: false, msg: '' };
}

  const [x1, y1] = dest; const dur = reduceMotion ? 1 : Math.min(1400, 500 + Math.hypot(x1 - x0, y1 - y0) * 1.4); const t0 = performance.now();

/* ───────────── Spiel: Pelles Spurensuche ───────────── */
const GW = {}; D.GAME.words.forEach(([w, tags]) => { GW[w] = { w, tags: tags.split(' ') }; });
const GWORDS = Object.values(GW);
const GCAT = {}; D.GAME.cats.forEach(c => { GCAT[c.id] = c; });
const GAME_FISH_DAY = 15;
function gameCats() { return D.GAME.cats.filter(c => c.st === 1 || stageDone(c.st)); }
function pickCats(cats, size) {
  const byStation = {}; cats.forEach(c => { (byStation[c.st] = byStation[c.st] || []).push(c); });
  const out = [];
  for (const st of shuffle(Object.keys(byStation))) { if (out.length >= size) break; out.push(shuffle(byStation[st])[0]); }
  const rest = shuffle(cats.filter(c => !out.includes(c)));
  while (out.length < size && rest.length) out.push(rest.pop());
  // practise weak spots: swap in the most-missed clue type now and then
  const bc = S.game.byCat || {};
  const weak = cats.filter(c => !out.includes(c) && bc[c.id] && bc[c.id].miss > bc[c.id].ok).sort((a, b) => bc[b.id].miss - bc[a.id].miss)[0];
  if (weak && Math.random() < 0.6) out[out.length - 1] = weak;
  return shuffle(out);
}
function makeRound() {
  const cats = gameCats(); const size = Math.min(5, cats.length);
  const has = (w, p) => w.tags.includes(p);
  // x-tags mark words a child could reasonably read as matching (e.g. 'laut' → der Laut): they never serve as a target or distractor for that clue
  const blocks = (w, p) => has(w, p) || has(w, 'x' + p);
  for (let attempt = 0; attempt < 500; attempt++) {
    const chosen = pickCats(cats, size);
    const preds = chosen.map(c => c.tag);
    const targets = []; let ok = true;
    for (const c of chosen) {
      const cand = GWORDS.filter(w => has(w, c.tag) && preds.filter(p => blocks(w, p)).length === 1 && !targets.includes(w));
      if (!cand.length) { ok = false; break; }
      targets.push(cand[Math.floor(Math.random() * cand.length)]);
    }
    if (!ok) continue;
    const pool = GWORDS.filter(w => !preds.some(p => blocks(w, p)) && !targets.includes(w) && !has(w, 'wrong')); // misspellings only ever appear as the answer to a spelling clue
    const near = shuffle(Array.from(new Set(chosen.reduce((a, c) => a.concat(c.near || []), []))).map(x => GW[x]).filter(w => w && pool.includes(w))).slice(0, 8);
    const rest = shuffle(pool.filter(w => !near.includes(w)));
    const distract = near.concat(rest).slice(0, 16 - size);
    if (distract.length < 16 - size) continue;
    return { cats: chosen.map(c => c.id), targets: targets.map(w => w.w), board: shuffle(targets.concat(distract)).map(w => w.w), step: 0, misses: 0, perClue: chosen.map(() => 0), found: [], tried: [], pelle: -1, hint: false, done: false, at: now() };
  }
  return null;
}
function gameFish(n) {
  const today = new Date().toISOString().slice(0, 10);
  if (S.game.fishDay.d !== today) S.game.fishDay = { d: today, n: 0 };
  const give = Math.max(0, Math.min(n, GAME_FISH_DAY - S.game.fishDay.n));
  if (!give) return 0;
  const before = S.fish; S.fish += give; S.game.fishDay.n += give; updateFish(true);
  WARD.forEach(w => { if (before < w.need && S.fish >= w.need) setTimeout(() => toast(`Neu in Pelles Schrank: ${w.name}!`, 3200), 900); });
  return give;
}
function clueShort(id, html) {
  const c = GCAT[id]; if (!c) return id;
  const t = c.clue.replace(/^(bei der |beim |bei dem )/, '').replace(/^Feld, auf dem nur ein /, '').replace(/^Feld mit einem /, '').replace(/ steht$/, '');
  const out = t.charAt(0).toUpperCase() + t.slice(1);
  return html ? out : strip(out);
}
function starsFor(m) { return m === 0 ? 3 : m <= 2 ? 2 : 1; }
function showGame(fresh) {
  CUR = { kind: 'game' };
  if (fresh || !S.game.round || S.game.round.done) { S.game.round = makeRound(); save(); }
  window.scrollTo(0, 0);
  renderGame();
}
let GBUSY = false;
function renderGame() {
  const R = S.game.round; const total = R.targets.length; const done = R.done;
  const c = GCAT[R.cats[Math.min(R.step, total - 1)]];
  const nCats = gameCats().length;
  const fishes = R.targets.map((_, i) => `<span class="gf${i < R.step ? ' on' : ''}">${A.icon.fish}</span>`).join('');
  view().innerHTML = `<div class="shead"><button class="backbtn" data-act="home" aria-label="Zur Karte">${A.icon.back}</button>
    <div class="t"><h2>Pelles Spurensuche</h2><div class="k">Runde ${S.game.rounds + (done ? 0 : 1)} · ${nCats} Hinweis-Arten freigeschaltet${nCats < D.GAME.cats.length ? '<span class="gmore"> – mit jeder Station kommen neue dazu</span>' : ''}</div></div>
    <button class="btn ghost sm" data-act="gamehelp" aria-label="So geht's">?</button></div>
    <div class="card gclue">${done ? '' : `<div class="clue"><div class="av">${A.pelle({ wear: S.wear, tool: 'schaufel', mood: R.hint ? 'think' : 'happy' })}</div>
      <div class="bubble"><div class="lab">Pelles Zettel · Hinweis ${R.step + 1} von ${total}</div>Unter einem Feld liegt ein Fisch versteckt. Grabe ${c.clue}!
      ${R.hint ? `<div class="fb hint"><b>Tipp:</b> ${esc(c.hint)}</div>` : ''}</div></div>`}
      <div class="gbar"><span class="gfishes">${fishes}</span><span class="small">Grabungen daneben: <b>${R.misses}</b></span></div></div>
    <div class="gfield" id="gfield">${R.board.map((w, i) => {
      const f = R.found.indexOf(i); const cls = f >= 0 ? ' found' : (done ? ' melt' : '');
      return `<button class="snow${cls}" data-i="${i}" ${f >= 0 || done ? 'disabled' : ''}>${f >= 0 ? `<span class="gfi">${A.icon.fish}</span><span class="w">${esc(w)}</span>` : `<span class="w">${esc(w)}</span>`}</button>`; }).join('')}
      <div class="gpelle" id="gpelle">${A.pelle({ wear: S.wear, tool: 'schaufel' })}</div>
      ${done ? `<div class="gchest">${A.chest(true)}</div>` : ''}</div>
    <div id="gresult"></div>`;
  const field = $('#gfield'); const pel = $('#gpelle');
  const place = (i, instant) => {
    let x, y;
    if (i < 0) { x = field.clientWidth / 2 - pel.offsetWidth / 2; y = field.clientHeight - pel.offsetHeight * 0.88; } else { const b = $(`.snow[data-i="${i}"]`, field); x = b.offsetLeft + b.offsetWidth - pel.offsetWidth * 0.68; y = b.offsetTop - pel.offsetHeight * 0.66; }
    if (instant) { pel.style.transition = 'none'; pel.style.transform = `translate(${x}px, ${y}px)`; void pel.offsetWidth; pel.style.transition = ''; } else pel.style.transform = `translate(${x}px, ${y}px)`;
  };
  place(R.pelle, true);
  if (done) { gameResult(); return; }
  field.addEventListener('click', (e) => {
    const b = e.target.closest('.snow'); if (!b || b.disabled || GBUSY) return;
    const i = +b.dataset.i; GBUSY = true; R.pelle = i; place(i);
    const wait = reduceMotion ? 10 : 470;
    setTimeout(() => {
      b.classList.add('dig');
      setTimeout(() => {
        b.classList.remove('dig');
        const cat = R.cats[R.step]; const bc = S.game.byCat[cat] = S.game.byCat[cat] || { ok: 0, miss: 0 };
        if (R.board[i] === R.targets[R.step]) {
          const first = R.perClue[R.step] === 0;
          R.found.push(i); bc.ok++; R.step++; R.hint = false;
          if (first) gameFish(1);
          logIt({ id: 'G:' + cat, mode: 'game', r: first ? 'ok1' : 'ok2', a1: R.board[i] });
          if (R.step >= total) { finishGame(); } else { save(); toast(first ? 'Fisch gefunden! Hier ist der nächste Zettel.' : 'Gefunden! Weiter geht’s.', 1800); renderGame(); }
        } else {
          R.misses++; R.perClue[R.step]++; bc.miss++; R.hint = true; R.tried.push(i);
          logIt({ id: 'G:' + cat, mode: 'game', r: 'miss', a1: R.board[i] });
          save(); b.classList.add('no'); toast(`Nur Schnee unter „${R.board[i]}“! Lies den Tipp.`, 2200);
          setTimeout(() => { GBUSY = false; renderGame(); }, 650);
          return;
        }
        GBUSY = false;
      }, reduceMotion ? 10 : 380);
    }, wait);
  });
}
function finishGame() {
  const R = S.game.round; R.done = true; R.stars = starsFor(R.misses);
  S.game.rounds++; S.game.best = Math.max(S.game.best || 0, R.stars);
  R.fish = gameFish(R.stars);
  S.game.hist.push({ at: now(), cats: R.cats, misses: R.misses, stars: R.stars }); if (S.game.hist.length > 60) S.game.hist = S.game.hist.slice(-60);
  save(); GBUSY = false; renderGame();
}

function compStats(k) {
  const ids = Object.keys(TASK).filter(id => TASK[id].t.k === k && TASK[id].t.type !== 'paper' && !TASK[id].test);
  let n = 0, pts = 0;
  ids.forEach(id => { const r = S.tasks[id]; if (r) { n++; pts += r.r === 'ok1' ? 1 : r.r === 'ok2' ? .5 : 0; } });
  let tn = 0, tok = 0;
  S.tests.forEach(run => Object.keys(run.ans).forEach(id => { if (TASK[id].t.k === k) { tn++; if (run.ans[id].ok) tok++; } }));
  const paperIds = Object.keys(S.paper).filter(key => { const p = S.paper[key]; return TASK[p.id] && TASK[p.id].t.k === k; });
  const pOk = paperIds.filter(key => ['ok', 'okfix'].includes(S.paper[key].status)).length;
  const pFix = paperIds.filter(key => ['fix', 'refix'].includes(S.paper[key].status)).length;
  const total = n + tn; const score = total ? (pts + tok) / total : null;
  const stars = score === null ? 0 : score >= .9 ? 3 : score >= .7 ? 2 : 1;
  return { n, of: ids.length, pts, tn, tok, score, stars, pOk, pFix, pAll: paperIds.length };
}

      ${comps.map(c => `<tr><td>${esc(c.en)}</td><td>${c.n ? `${c.pts}/${c.n} (${c.of} tasks)` : '–'}</td><td>${c.tn ? `${c.tok}/${c.tn}` : '–'}</td><td>${c.pAll ? `${c.pOk} / ${c.pFix}` : '–'}</td><td>${starsHTML(c.stars)}</td></tr>`).join('')}</table>
      <p class="small">Finn's own ticks: ${D.K_ORDER.filter(k => S.self[k]).map(k => D.K[k].en).join('; ') || 'none yet'}</p></div>
    <div class="card"><h3>Not right the first time</h3>${mistakes.length ? `<table class="rep"><tr><th>Task</th><th>1st answer</th><th>2nd answer</th><th>Correct</th></tr>${mistakes.map(x => `<tr><td><b>${x.id}</b> ${esc(x.q)}</td><td>${esc(x.first || '–')}</td><td>${esc(x.second || '–')}${x.result === 'fail' ? ' ✗' : ' ✓'}</td><td>${esc(x.correct)}</td></tr>`).join('')}</table>` : '<p class="muted">Nothing yet.</p>'}</div>
    <div class="card"><h3>Game: Pelles Spurensuche</h3>${gameReportHTML()}</div>
    <div class="card"><h3>Share with Claude</h3><p class="small">Export the progress file and upload it in the Baby Bees project to get an updated or more targeted version.</p>
      <div class="actions"><button class="btn sm" data-x="copyrep">Copy report (text)</button><button class="btn sm" data-x="export">Export for Claude (JSON)</button><button class="btn sm ghost" data-x="copyjson">Copy JSON</button></div></div>`;
  $('[data-x="copyrep"]', root).addEventListener('click', () => copyText(reportText()));
  $('[data-x="export"]', root).addEventListener('click', () => download(`pelles-schatzsuche-${S.name.toLowerCase()}-${new Date().toISOString().slice(0, 10)}.json`, exportJSON()));
  $('[data-x="copyjson"]', root).addEventListener('click', () => copyText(exportJSON()));
}
function gameStats() {
  const bc = S.game.byCat || {};
  const rows = Object.keys(bc).map(id => ({ id, label: clueShort(id), ok: bc[id].ok, miss: bc[id].miss })).sort((a, b) => b.miss - a.miss || a.ok - b.ok);
  return { rounds: S.game.rounds, best: S.game.best, rows };
}
function gameReportHTML() {
  const g = gameStats();
  if (!g.rounds && !g.rows.length) return '<p class="muted">Not played yet. Each round has up to 5 clues; clue types unlock with each cleared station.</p>';
  return `<p>Rounds finished: <b>${g.rounds}</b> · best: ${starsHTML(g.best)}</p>
    <table class="rep"><tr><th>Clue type</th><th>Found</th><th>Wrong digs</th></tr>${g.rows.map(r => `<tr><td>${esc(r.label)}</td><td>${r.ok}</td><td>${r.miss}${r.miss > r.ok ? ' ⚠' : ''}</td></tr>`).join('')}</table>
    <p class="small">Clue types with more wrong digs than finds (⚠) come up more often in new rounds.</p>`;
}
function reportText() {
  const { comps, mistakes } = reportData();
  const L = [];
  L.push(`Pelles Schatzsuche – German Klasse 4 – report for ${S.name} (${new Date().toLocaleString('en-GB')})`, `App ${VERSION}`, '');
  L.push(`Stations cleared: ${countGot()}/${N} · Fish: ${S.fish} · Mock tests: ${S.tests.map(t => `${t.id} ${t.score}/${t.of}`).join(', ') || 'none'}`, '');
  L.push('By checklist item:');
  comps.forEach(c => L.push(`- ${c.en}: stations ${c.n ? `${c.pts}/${c.n}` : '–'}, mock test ${c.tn ? `${c.tok}/${c.tn}` : '–'}, paper ok/to fix ${c.pOk}/${c.pFix}`));
  L.push('', 'Not right the first time:');
  mistakes.forEach(x => L.push(`- ${x.id} ${x.q} | 1st: ${x.first || '–'} | 2nd: ${x.second || '–'} | correct: ${x.correct}`));
  const gs = gameStats();
  L.push('', `Game (Spurensuche): ${gs.rounds} rounds, best ${gs.best} stars`);
  gs.rows.slice(0, 8).forEach(r => L.push(`- ${r.label}: found ${r.ok}, wrong digs ${r.miss}`));
  L.push('', 'Paper tasks:');
  Object.keys(S.paper).forEach(k => L.push(`- ${k}: ${PST_EN[S.paper[k].status] || S.paper[k].status}${S.paper[k].note ? ' – note: ' + S.paper[k].note : ''}`));
  return L.join('\n');
}
function exportJSON() {
  const out = { app: 'Pelles Schatzsuche (Deutsch Klasse 4)', edition: EDITION, version: VERSION, exportedAt: now(), name: S.name, fish: S.fish,
    stations: S.stages, found: S.found, final: S.final,
    tasks: Object.fromEntries(Object.keys(S.tasks).map(id => [id, Object.assign({ k: TASK[id].t.k, q: strip(TASK[id].t.q), correct: TASK[id].t.ex || '' }, S.tasks[id])])),
    paper: Object.fromEntries(Object.keys(S.paper).map(k => [k, Object.assign({ title: TASK[S.paper[k].id] ? TASK[S.paper[k].id].t.title : '' }, S.paper[k])])),
    tests: S.tests, testInProgress: S.testRun && !S.testRun.done ? S.testRun : null, kiste: Object.keys(S.kiste), checklistSelf: S.self, clueMisses: S.clueMiss, game: { rounds: S.game.rounds, best: S.game.best, byCat: S.game.byCat, hist: S.game.hist }, log: S.log };
  return JSON.stringify(out, null, 1);
}

      if (t.type === 'paper') h += `<div class="pi"><b>${t.id} ${esc(t.title)}</b><div>${t.task}</div>${t.art === 'compass' ? A.compass() : ''}${kind !== 'paper' ? `<div class="sol"><b>Lösung:</b> ${t.sol}</div>` : ''}</div>`;
      else if (kind === 'all') h += `<div class="pi"><b>${t.id}</b> ${strip(t.q)}<div class="sol">${esc(t.ex || '')}</div></div>`;

}

  $('[data-x="reset"]', root).addEventListener('click', () => {
    const m = modal(`<h2>Reset everything?</h2><p>This cannot be undone. Type <b>RESET</b> to confirm.</p><input class="note" style="min-height:0" id="rs"><div class="actions"><button class="btn sm" data-x="do">Reset</button><button class="btn sm ghost" data-x="no">Cancel</button></div>`, { en: true });
